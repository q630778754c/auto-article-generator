name: Deploy Backend (Tunnel)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          npm install -g localtunnel
          cd backend/web && npm install

      - name: Build frontend
        run: |
          cd backend/web
          npm run build

      - name: Deploy server and tunnel
        run: |
          set -e
          set -x

          mkdir -p /tmp/data/images /tmp/data/logs

          export DATA_DIR=/tmp/data
          export STORAGE_BACKEND=local
          export APP_HOST=0.0.0.0
          export APP_PORT=8000
          export LOG_LEVEL=INFO
          export ADMIN_USERNAME=admin
          export LLM_PROVIDER=openai
          export LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          export LLM_BASE_URL=https://integrate.api.nvidia.com/v1
          export LLM_MODEL=meta/llama-3.1-405b-instruct
          export BUILD_VERSION=github-action-v8
          export CORS_ALLOWED_ORIGINS=*
          export UNIFIED_PLATFORM_BASE_URL=https://unified-auth-admin.pages.dev/api
          export UNIFIED_PLATFORM_APP_ID=${{ secrets.UNIFIED_PLATFORM_APP_ID }}
          export UNIFIED_PLATFORM_APP_SECRET=${{ secrets.UNIFIED_PLATFORM_APP_SECRET }}

          echo "=== Testing imports ==="
          cd backend
          python -c "from app.main import create_app; app = create_app(); print('App created OK'); print(f'Routes: {len(app.routes)}')" || { echo "Import failed!"; cat /tmp/server.log 2>/dev/null; exit 1; }

          echo "=== Starting server ==="
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          echo "Server PID: $SERVER_PID"

          for i in $(seq 1 30); do
            if curl -s http://localhost:8000/api/v1/health 2>/dev/null | grep -q healthy; then
              echo "Server ready!"
              break
            fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then
              echo "Server process died!"
              echo "=== Server log ==="
              cat /tmp/server.log
              exit 1
            fi
            echo "  Waiting... attempt $i"
            sleep 2
          done

          echo "=== Server log ==="
          cat /tmp/server.log

          cd ..

          echo "=== Starting tunnel ==="
          lt --port 8000 --subdomain aag-api > /tmp/tunnel.log 2>&1 &
          TUNNEL_PID=$!
          echo "Tunnel PID: $TUNNEL_PID"
          sleep 10

          echo "=== Tunnel log ==="
          cat /tmp/tunnel.log

          for i in $(seq 1 10); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" https://aag-api.loca.lt/api/v1/health 2>/dev/null || echo "000")
            echo "Tunnel check $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then
              echo "Tunnel OK!"
              break
            fi
            sleep 5
          done

          echo "=== Active at $(date) ==="
          for i in $(seq 1 170); do
            sleep 60
            HEALTH=$(curl -s http://localhost:8000/api/v1/health 2>/dev/null | head -c 100)
            echo "Alive $(date): $HEALTH"

            if ! echo "$HEALTH" | grep -q healthy; then
              echo "Server not healthy"
              if kill -0 $SERVER_PID 2>/dev/null; then
                echo "Server process running but unhealthy"
              else
                echo "Server died, restarting..."
                cat /tmp/server.log
                cd backend
                nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/server.log 2>&1 &
                SERVER_PID=$!
                sleep 10
                cd ..
              fi
            fi

            TUNNEL_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://aag-api.loca.lt/api/v1/health 2>/dev/null || echo "000")
            if [ "$TUNNEL_CODE" != "200" ]; then
              echo "Tunnel not responding ($TUNNEL_CODE)"
              if kill -0 $TUNNEL_PID 2>/dev/null; then
                echo "Tunnel process running"
              else
                echo "Tunnel died, restarting..."
                cat /tmp/tunnel.log
                lt --port 8000 --subdomain aag-api > /tmp/tunnel.log 2>&1 &
                TUNNEL_PID=$!
                sleep 10
              fi
            fi
          done

          echo "=== Final status ==="
          kill -0 $SERVER_PID 2>/dev/null && echo "Server: RUNNING" || echo "Server: DEAD"
          kill -0 $TUNNEL_PID 2>/dev/null && echo "Tunnel: RUNNING" || echo "Tunnel: DEAD"
          echo "=== Server log (last 50 lines) ==="
          tail -50 /tmp/server.log
          echo "=== Tunnel log ==="
          cat /tmp/tunnel.log
