name: Deploy Backend (Tunnel)

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 */5 * * *'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 290
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          npm install -g localtunnel

      - name: Start server
        run: |
          mkdir -p /tmp/data/images /tmp/data/logs
          cd backend
          export DATA_DIR=/tmp/data
          export STORAGE_BACKEND=local
          export APP_HOST=0.0.0.0
          export APP_PORT=8000
          export LOG_LEVEL=INFO
          export ADMIN_USERNAME=admin
          export LLM_PROVIDER=openai
          export LLM_API_KEY=${{ secrets.LLM_API_KEY }}
          export LLM_BASE_URL=https://integrate.api.nvidia.com/v1
          export LLM_MODEL=meta/llama-3.1-405b-instruct
          export BUILD_VERSION=github-action-v1
          nohup python -m uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/server.log 2>&1 &
          sleep 5
          cat /tmp/server.log

      - name: Start tunnel and keep alive
        run: |
          lt --port 8000 --subdomain aag-api > /tmp/tunnel.log 2>&1 &
          sleep 10
          cat /tmp/tunnel.log
          echo "Tunnel started at: $(date)"
          for i in $(seq 1 170); do
            sleep 60
            echo "Alive at: $(date) - $(curl -s http://localhost:8000/api/v1/health | head -c 100)"
          done
