# Render.com Blueprint 一键部署配置（v3）
# 用户在 Render 中 "New +" → "Blueprint" 选择本仓库即可自动创建
# Docker runtime：自包含前后端构建，不依赖平台预装 Node
services:
  - type: web
    name: auto-article-generator
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: BUILD_VERSION
        value: render-v1
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: STORAGE_BACKEND
        value: local
      - key: DATA_DIR
        value: /app/data
      - key: LOG_LEVEL
        value: INFO
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: UNIFIED_PLATFORM_BASE_URL
        value: https://unified-auth-admin.pages.dev/api
      - key: UNIFIED_PLATFORM_APP_ID
        sync: false
      - key: UNIFIED_PLATFORM_APP_SECRET
        sync: false
      - key: LLM_PROVIDER
        value: openai
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: LLM_MODEL
        value: meta/llama-3.1-405b-instruct
