services:
  - type: web
    name: auto-article-generator
    runtime: python
    plan: free
    region: singapore
    branch: main
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: bash ../scripts/render_start.sh
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: 10000
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: DATA_DIR
        value: /data
      - key: LOG_LEVEL
        value: INFO
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: deepseek
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.deepseek.com/v1
      - key: LLM_MODEL
        value: deepseek-chat
      - key: STORAGE_BACKEND
        value: bitiful
      - key: BITIFUL_ENDPOINT
        sync: false
      - key: BITIFUL_ACCESS_KEY
        sync: false
      - key: BITIFUL_SECRET_KEY
        sync: false
      - key: BITIFUL_BUCKET
        sync: false
      - key: BITIFUL_PUBLIC_BASE
        sync: false
      - key: UNIFIED_PLATFORM_BASE_URL
        value: https://unified-auth-admin.pages.dev/api
      - key: UNIFIED_PLATFORM_APP_ID
        sync: false
      - key: UNIFIED_PLATFORM_APP_SECRET
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
    disk:
      name: data-disk
      mountPath: /data
      sizeGB: 1